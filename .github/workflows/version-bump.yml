name: Version bump

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Require dispatch from next
        if: github.ref != 'refs/heads/next'
        run: |
          echo "version-bump.yml updates the Rust line. Dispatch it from next:" >&2
          echo "  gh workflow run version-bump.yml --ref next -f release_type=patch" >&2
          exit 1

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: next

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.99.1"

      - name: Bump version
        id: bump
        run: python3 scripts/bump-version.py --release-type "${{ inputs.release_type }}"

      - name: Read new version
        id: version
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Commit and push changes
        id: commit
        env:
          VERSION_TAG: v${{ steps.version.outputs.version }}
        run: |
          branch="chore/release/${VERSION_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(version): ${VERSION_TAG}"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: v${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
          EFFECTIVE_BUMP: ${{ steps.bump.outputs.bump_type }}
        run: |
          gh pr create \
            --base next \
            --head "$BRANCH" \
            --title "chore(version): ${VERSION_TAG}" \
            --body "$(cat <<EOF
          Automated version bump to '${VERSION_TAG}'.
          - Requested release type: '${REQUESTED_RELEASE_TYPE}'
          - Effective bump: '${EFFECTIVE_BUMP}'
          - Generated by workflow_dispatch

          This pull request is opened with the workflow GITHUB_TOKEN, so CI is created in an approval-required state and does not run on its own. A maintainer with write access has to approve the pending workflows on this pull request. That starts the pull_request CI run, which is what the required checks use. Dispatching CI separately does not satisfy those checks.
          EOF
          )"
