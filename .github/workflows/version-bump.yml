name: Version bump

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Version bump type"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - prepatch
          - preminor
          - premajor
          - prerelease
      target_branch:
        description: "Branch to bump and receive the release pull request"
        required: true
        type: choice
        default: main
        options:
          - main
          - next

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_branch }}

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bump version
        id: bump
        run: |
          node --experimental-strip-types scripts/bump-version.ts \
            --release-type "${{ inputs.release_type }}"

      - name: Read new version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate target version
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "$TARGET_BRANCH" == "next" && "$VERSION" != *-* ]]; then
            echo "The next branch only accepts prerelease versions, got '$VERSION'." >&2
            exit 1
          fi

      - name: Commit and push changes
        id: commit
        env:
          TARGET_BRANCH: ${{ inputs.target_branch }}
          VERSION_TAG: v${{ steps.version.outputs.version }}
        run: |
          branch="chore/release/${TARGET_BRANCH}/${VERSION_TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add -A
          git commit -m "chore(version): ${VERSION_TAG}"
          git push -u origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_TAG: v${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.commit.outputs.branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUESTED_RELEASE_TYPE: ${{ inputs.release_type }}
          EFFECTIVE_BUMP: ${{ steps.bump.outputs.bump_type }}
        run: |
          gh pr create \
            --base "$TARGET_BRANCH" \
            --head "$BRANCH" \
            --title "chore(version): ${VERSION_TAG}" \
            --body "$(cat <<EOF
          Automated version bump to '${VERSION_TAG}'.
          - Target branch: '${TARGET_BRANCH}'
          - Requested release type: '${REQUESTED_RELEASE_TYPE}'
          - Effective bump: '${EFFECTIVE_BUMP}'
          - Generated by workflow_dispatch
          EOF
          )"
