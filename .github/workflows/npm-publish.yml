name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
          cache: pnpm

      # Pin the 12 line, not `latest`, so a future npm major cannot land in a
      # release job. npm 12 requires Node ^22.22.2 || ^24.15.0 || >=26, and
      # this job reads .node-version. Merge the Node 24.22 LTS bump first.
      - name: Install npm 12
        run: |
          npm install -g npm@12
          npm --version

      - name: Determine npm dist-tag
        id: dist_tag
        run: |
          release_tag="${{ github.event.release.tag_name }}"
          release_tag="${release_tag:-${GITHUB_REF##*/}}"
          version="${release_tag#v}"

          if [[ "${{ github.event.release.prerelease }}" == "true" || "$version" == *"-"* ]]; then
            echo "npm_tag=next" >>"$GITHUB_OUTPUT"
          else
            echo "npm_tag=latest" >>"$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish @phantompane/cli
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_ALWAYS_AUTH: true
        run: pnpm -r publish --access public --provenance --no-git-checks --tag ${{ steps.dist_tag.outputs.npm_tag }}

      - name: Publish @aku11i/phantom (backward compatibility)
        env:
          NPM_CONFIG_PROVENANCE: true
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
          NPM_CONFIG_ALWAYS_AUTH: true
        run: |
          cd packages/cli/dist
          sed -i 's/"name": "@phantompane\/cli"/"name": "@aku11i\/phantom"/' package.json
          npm publish --access public --provenance --tag ${{ steps.dist_tag.outputs.npm_tag }}
