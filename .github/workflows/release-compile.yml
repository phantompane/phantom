name: Upload release assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang xz-utils
          # scriptc links cross-compiled executables with zig.
          zig_version=0.15.2
          zig_dir="/usr/local/zig-x86_64-linux-${zig_version}"
          curl -fsSL "https://ziglang.org/download/${zig_version}/zig-x86_64-linux-${zig_version}.tar.xz" -o /tmp/zig.tar.xz
          sudo tar -xJf /tmp/zig.tar.xz -C /usr/local
          echo "${zig_dir}" >> "$GITHUB_PATH"
          "${zig_dir}/zig" version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Compile
        run: pnpm compile

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          mapfile -d '' files < <(find packages/cli/output -type f ! -name '.keep' -print0)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found in packages/cli/output" >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            echo "Uploading ${file}"
            gh release upload "${RELEASE_TAG}" "${file}" --clobber
          done
