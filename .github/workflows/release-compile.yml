name: Upload release assets

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  compile:
    name: Build ${{ matrix.asset_os }}-${{ matrix.asset_arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
          # Intel macOS runners. macos-13 is the GitHub-hosted x64 image.
          - os: macos-13
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: x64
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)
          archive="phantom-v${version}-${{ matrix.asset_os }}-${{ matrix.asset_arch }}.tar.gz"
          tar -C "target/${{ matrix.target }}/release" -czf "$archive" phantom
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$ARCHIVE" --clobber
