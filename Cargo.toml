[package]
name = "phantom"
version = "6.3.2"
edition = "2021"
rust-version = "1.89"
publish = false
description = "Rust prototype of the phantom Git worktree manager"
license = "MIT"

[[bin]]
name = "ptm"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "1"
toml_edit = "0.25.17"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
strip = "symbols"
